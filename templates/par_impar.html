<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Par o Impar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Par o Impar</h2>
        <form method="POST">
            <label for="numero">Ingresa un numero:</label>
            <input type="number" id="numero" name="numero" required placeholder="">
            <button type="submit">Evaluar</button>
        </form>

        {% if resultado %}
            <div class="result">
                <h3>{{ resultado }}</h3>
                <p><strong>Estado BD:</strong> {{ mensaje_db }}</p>
            </div>
        {% endif %}
        
        <a href="/" class="back-link"> Volver al Inicio</a>
    </div>
</body>
</html>
