<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla de Multiplicar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2> Tabla de Multiplicar</h2>
        <form method="POST">
            <label for="numero">Ingresa un numero:</label>
            <input type="number" id="numero" name="numero" required placeholder="">
            <button type="submit">Mostrar Tabla</button>
        </form>

        {% if tabla %}
            <div class="result" style="padding-bottom: 5px;">
                <h3>Tabla del {{ numero }}</h3>
            </div>
            <ul class="table-list">
                {% for fila in tabla %}
                    <li>{{ numero }} × {{ fila.multiplicador }} = <strong>{{ fila.resultado }}</strong></li>
                {% endfor %}
            </ul>
        {% endif %}

        <a href="/" class="back-link"> Volver al Inicio</a>
    </div>
</body>
</html>
